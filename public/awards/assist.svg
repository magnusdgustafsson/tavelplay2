  <text x="16" y="21"
        text-anchor="middle"
        font-family="Verdana, Arial, sans-serif"
        font-size="10"
        font-weight="900"
        fill="#FFFFFF">A</text>
  <rect x="12" y="12" width="1" height="3" fill="#FFFFFF" opacity="0.45"/>
